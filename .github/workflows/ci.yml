name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check pipeline

      - name: Test
        # No ODDS_API_KEY is set on purpose: the suite runs against recorded
        # fixtures, so a green CI run costs zero API credits.
        run: pytest -q

  php:
    name: Plugin lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: cs2pr

      - name: Syntax check every file
        # A parse error here would be a white screen on a live site, so this
        # gate runs before anything can reach WordPress.com.
        run: |
          find wordpress -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: WordPress coding standards
        run: |
          # Composer 2.2+ blocks plugins it has not been told to trust, and
          # --no-interaction turns that block into a hard failure rather than
          # a prompt. The installer plugin is what wires WPCS into phpcs, so
          # without this the next command dies before installing anything.
          composer global config --no-plugins \
            allow-plugins.dealerdirect/phpcodesniffer-composer-installer true

          composer global require --quiet --no-interaction \
            squizlabs/php_codesniffer wp-coding-standards/wpcs \
            dealerdirect/phpcodesniffer-composer-installer
          "$(composer global config bin-dir --absolute --quiet)/phpcs" \
            --standard=WordPress-Core \
            --extensions=php \
            --report=checkstyle \
            wordpress | cs2pr --graceful-warnings
